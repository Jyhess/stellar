[package]
name = "stellar-app"
description = "Interface graphique du simulateur Stellar (wgpu + egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "stellar"

[lib]
name = "stellar_app"
path = "src/lib.rs"

[[bin]]
name = "stellar"
path = "src/main.rs"

[[bin]]
name = "stellar-cli"
path = "src/cli.rs"

[dependencies]
stellar-domain.workspace = true
stellar-application.workspace = true
stellar-engine-cpu.workspace = true
stellar-engine-gpu.workspace = true
stellar-persistence.workspace = true
glam.workspace = true
bytemuck.workspace = true
eframe.workspace = true
rfd.workspace = true
chrono.workspace = true
rayon.workspace = true
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_Console"] }
