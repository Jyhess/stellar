name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # No graphics card on the runner: GPU tests run on Mesa's software OpenGL, under a virtual X server.
      WGPU_BACKEND: gl
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 .github/scripts/architecture.py
      - run: xvfb-run -a cargo test --workspace --exclude stellar-engine-gpu
      # GPU tests one at a time: in parallel they hang on the shared device.
      - run: xvfb-run -a cargo test -p stellar-engine-gpu -- --test-threads=1
