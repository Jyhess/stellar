[workspace]
resolver = "2"
members = [
    "crates/stellar-domain",
    "crates/stellar-application",
    "crates/stellar-engine-cpu",
    "crates/stellar-persistence",
    "crates/stellar-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
stellar-domain = { path = "crates/stellar-domain" }
stellar-application = { path = "crates/stellar-application" }
stellar-engine-cpu = { path = "crates/stellar-engine-cpu" }
stellar-persistence = { path = "crates/stellar-persistence" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
rand = "0.8"
rand_pcg = "0.3"
thiserror = "1"
bincode = "1.3"
zstd = "0.13"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
criterion = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
